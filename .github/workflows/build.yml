name: Publish J2K PikPak Cloud v0.2.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout TachiyomiJ2K v1.8.1
        uses: actions/checkout@v4
        with:
          repository: Jays2Kings/tachiyomiJ2K
          ref: v1.8.1
          path: j2k
          fetch-depth: 0

      - name: Patch J2K with PikPak Cloud Download
        shell: bash
        run: |
          echo "" | base64 -d > /tmp/patch_j2k.py
          python3 /tmp/patch_j2k.py

      - name: Repair archived FlexibleAdapter dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("j2k/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          old_core = 'implementation("com.github.arkon.FlexibleAdapter:flexible-adapter:c8013533")'
          old_ui = 'implementation("com.github.arkon.FlexibleAdapter:flexible-adapter-ui:c8013533")'
          if old_core not in s or old_ui not in s:
              raise SystemExit("Expected old FlexibleAdapter dependencies were not found")
          s = s.replace(old_core, 'implementation("eu.davidea:flexible-adapter:5.1.0")', 1)
          s = s.replace(old_ui, 'implementation("eu.davidea:flexible-adapter-ui:1.0.0")', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy upstream CI Gradle settings
        working-directory: j2k
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Build modified J2K
        working-directory: j2k
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDevDebug --stacktrace --console=plain 2>&1 | tee /tmp/j2k-pikpak-cloud-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2K-PikPak-Cloud-v0.2.1-build-log
          path: /tmp/j2k-pikpak-cloud-build.log
          if-no-files-found: ignore

      - name: Collect universal debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find j2k/app/build/outputs/apk/dev/debug -type f -name '*universal*debug*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            APK="$(find j2k/app/build/outputs/apk/dev/debug -type f -name '*.apk' -print -quit)"
          fi
          test -n "$APK"
          test -f "$APK"
          cp "$APK" out/J2K-PikPak-Cloud-v0.2.1.apk
          ls -lh out/J2K-PikPak-Cloud-v0.2.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2K-PikPak-Cloud-v0.2.1
          path: out/J2K-PikPak-Cloud-v0.2.1.apk

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="j2k-pikpak-cloud-v0.2.1"
          NOTES="v0.2.1 fixes PikPak Cloud Download destination handling: when parent_id is set, folder_type is no longer DOWNLOAD, preventing tasks from falling back to My Pack."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/J2K-PikPak-Cloud-v0.2.1.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" out/J2K-PikPak-Cloud-v0.2.1.apk \
              --title "J2K PikPak Cloud v0.2.1" \
              --notes "$NOTES"
          fi
