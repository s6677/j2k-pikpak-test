name: Publish J2K PikPak Test v0.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout TachiyomiJ2K v1.8.1
        uses: actions/checkout@v4
        with:
          repository: Jays2Kings/tachiyomiJ2K
          ref: v1.8.1
          path: j2k
          fetch-depth: 0

      - name: Patch J2K for PikPak test
        shell: bash
        run: |
          echo "" | base64 -d > /tmp/patch_j2k.py
          python3 /tmp/patch_j2k.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy upstream CI Gradle settings
        working-directory: j2k
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Build modified J2K
        working-directory: j2k
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDevDebug --stacktrace --console=plain 2>&1 | tee /tmp/j2k-pikpak-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2K-PikPak-Test-v0.1-build-log
          path: /tmp/j2k-pikpak-build.log
          if-no-files-found: ignore

      - name: Collect universal debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          APK="$(find j2k/app/build/outputs/apk/dev/debug -type f -name '*universal*debug*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            APK="$(find j2k/app/build/outputs/apk/dev/debug -type f -name '*.apk' -print -quit)"
          fi

          test -n "$APK"
          test -f "$APK"

          cp "$APK" out/J2K-PikPak-Test-v0.1.apk
          ls -lh out/J2K-PikPak-Test-v0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2K-PikPak-Test-v0.1
          path: out/J2K-PikPak-Test-v0.1.apk

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="j2k-pikpak-test-v0.1"
          NOTES="Based on TachiyomiJ2K v1.8.1. Manual download now offers Local / PikPak URL test / Both. PikPak branch only resolves real image URLs; it does not create cloud-download tasks yet."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/J2K-PikPak-Test-v0.1.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" out/J2K-PikPak-Test-v0.1.apk \
              --title "J2K PikPak Test v0.1" \
              --notes "$NOTES"
          fi
